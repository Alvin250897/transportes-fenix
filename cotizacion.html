<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoja de cotización · Transportes Fénix</title><link rel="stylesheet" href="styles.css"><style>@media print{header,.noPrint{display:none!important}body{background:#fff;color:#111}.sheet{box-shadow:none;border:0}.sheet *{color:#111!important}.sheet .muted{color:#555!important}}.sheet{max-width:900px;margin:28px auto;padding:34px;background:#111;border:1px solid #b58b2a;border-radius:18px}.line{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #333;padding:10px 0}.amount{font-size:2rem;font-weight:800}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">TRANSPORTES FÉNIX</a><div class="spacer"></div><button class="primary noPrint" onclick="window.print()">Imprimir / Guardar PDF</button></div></header><main class="sheet" id="sheet"><p>Cargando cotización…</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script>
(async()=>{let user=await getSessionUser();if(!user)return location='index.html';let id=new URLSearchParams(location.search).get('id');if(!id){sheet.innerHTML='<p>Cotización no encontrada.</p>';return}let {data:q,error}=await sb.from('fenix_quote_requests').select('*,fenix_vehicles(name,category,passenger_capacity)').eq('id',id).single();if(error||!q){sheet.innerHTML='<p>No fue posible cargar la cotización.</p>';return}let freq={unico:'Traslado único',varios_dias:'Servicio por varios días',diario_personal:'Traslado diario de personal'}[q.service_frequency]||q.service_frequency||'Traslado único';sheet.innerHTML=`<div class="eyebrow">Hoja de cotización</div><h1>TRANSPORTES FÉNIX</h1><p class="muted">Tu destino, en buenas manos.</p><div class="line"><b>Folio</b><span>${esc(q.quote_folio||'')}</span></div><div class="line"><b>Cliente</b><span>${esc(q.requester_name)}</span></div><div class="line"><b>Empresa</b><span>${esc(q.company_name||'—')}</span></div><div class="line"><b>Contacto</b><span>${esc(q.requester_phone||'')} · ${esc(q.requester_email||'')}</span></div><div class="line"><b>Servicio</b><span>${esc(q.service_type)} · ${esc(freq)}</span></div><div class="line"><b>Ruta</b><span>${esc(q.origin)} → ${esc(q.destination)}</span></div><div class="line"><b>Salida</b><span>${fmtDate(q.departure_at)}</span></div><div class="line"><b>Regreso</b><span>${q.return_at?fmtDate(q.return_at):'—'}</span></div><div class="line"><b>Pasajeros</b><span>${q.passengers}</span></div><div class="line"><b>Unidad propuesta</b><span>${esc(q.fenix_vehicles?.name||'Por asignar')}</span></div>${q.price_mode==='por_dia'?`<div class="line"><b>Precio por día</b><span>${fmtMoney(q.unit_price)} × ${q.billable_days} día(s)</span></div>`:''}<div class="line"><b>Total cotizado</b><span class="amount">${q.quoted_amount!=null?fmtMoney(q.quoted_amount):'Pendiente'}</span></div><p class="muted small" style="margin-top:28px">Cotización sujeta a disponibilidad y confirmación final del servicio. Los datos bancarios internos de la empresa no se incluyen en esta hoja.</p>`})();
</script></body></html>
