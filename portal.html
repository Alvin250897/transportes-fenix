<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Portal · Transportes Fénix</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="wrap nav"><a href="index.html" class="brand">TRANSPORTES FÉNIX</a><div class="spacer"></div><a id="adminLink" class="btn ghost hidden" href="admin.html">Administración</a><button id="logout" class="ghost">Salir</button></div></header>
<section class="section"><div class="wrap"><div class="eyebrow">Portal de usuario</div><h2 id="hello">Mi cuenta</h2><p id="role" class="muted"></p><div class="grid4"><div class="stat"><strong id="total">0</strong><span class="muted">Solicitudes</span></div><div class="stat"><strong id="quoted">0</strong><span class="muted">Cotizadas</span></div><div class="stat"><strong id="confirmed">0</strong><span class="muted">Confirmadas</span></div><div class="stat"><strong id="completed">0</strong><span class="muted">Finalizadas</span></div></div>
<div class="panel" style="margin-top:22px"><h3>Mis solicitudes</h3><div id="quotes"></div></div></div></section>
<dialog id="detail" class="modal"><div class="modalInner"><div id="detailBody"></div><div id="paymentArea" class="panel hidden"><h3>Comprobante de pago</h3><p class="muted small">Disponible cuando la cotización ha sido aprobada.</p><form id="paymentForm"><input type="file" id="paymentFile" accept="image/*,.pdf" required><button class="primary">Subir comprobante</button></form><div id="paymentList"></div></div><form id="msgForm"><input type="hidden" id="qid"><label>Mensaje de seguimiento</label><textarea id="message" required></textarea><button class="primary">Enviar mensaje</button></form><div class="actions"><button onclick="detail.close()" class="ghost">Cerrar</button></div></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script>
let user,profile,all=[];
async function init(){user=await getSessionUser();if(!user)return location='index.html';profile=await getProfile(user);hello.textContent=profile?.full_name?`Hola, ${profile.full_name}`:'Mi cuenta';role.textContent=`Nivel: ${profile?.role||'cliente'}`;if(['ejecutivo','operador','admin','superadmin'].includes(profile?.role))adminLink.classList.remove('hidden');await loadQuotes()}
async function loadQuotes(){let {data,error}=await sb.from('fenix_quote_requests').select('*,fenix_vehicles(name)').order('created_at',{ascending:false});if(error){quotes.innerHTML=`<p>${esc(error.message)}</p>`;return}all=data||[];total.textContent=all.length;quoted.textContent=all.filter(x=>x.status==='cotizada').length;confirmed.textContent=all.filter(x=>x.status==='confirmada').length;completed.textContent=all.filter(x=>x.status==='finalizada').length;quotes.innerHTML=all.map(x=>`<div class="rowCard"><div class="two"><div><b>${esc(x.origin)} → ${esc(x.destination)}</b><div class="muted small">${fmtDate(x.departure_at)} · ${x.passengers} pasajeros · ${esc(x.status)}</div></div><div class="right">${x.quoted_amount!=null?`<b>${fmtMoney(x.quoted_amount)}</b><br>`:''}<button class="ghost" onclick="openQuote('${x.id}')">Ver seguimiento</button></div></div></div>`).join('')||'<p class="muted">Aún no tienes solicitudes.</p>'}
window.openQuote=async id=>{let x=all.find(q=>q.id===id);qid.value=id;let approved=['confirmada','programada','finalizada'].includes(x.status);let [{data:m},{data:h},{data:r}]=await Promise.all([sb.from('fenix_quote_messages').select('*').eq('quote_request_id',id).order('created_at'),sb.from('fenix_quote_status_history').select('*').eq('quote_request_id',id).order('created_at'),approved?sb.from('fenix_payment_receipts').select('*').eq('quote_request_id',id).order('created_at',{ascending:false}):Promise.resolve({data:[]})]);let freq={unico:'Traslado único',varios_dias:'Servicio por varios días',diario_personal:'Traslado diario de personal'}[x.service_frequency]||x.service_frequency||'Traslado único';detailBody.innerHTML=`<h2>${esc(x.origin)} → ${esc(x.destination)}</h2><p class="muted">${esc(x.status)} · ${fmtDate(x.departure_at)} · ${esc(x.quote_folio||'')}</p><p class="ok small">${esc(freq)}${x.service_days_requested?` · ${x.service_days_requested} día(s) solicitados`:''}</p>${x.quoted_amount!=null?`<h3>${fmtMoney(x.quoted_amount)}</h3>${x.price_mode==='por_dia'?`<p class="ok">${fmtMoney(x.unit_price)} por día × ${x.billable_days} día(s)</p>`:''}<div class="actions"><a class="btn ghost" target="_blank" href="cotizacion.html?id=${encodeURIComponent(x.id)}">Ver / imprimir hoja de cotización</a></div>`:''}<h3>Historial</h3>${(h||[]).map(i=>`<div class="rowCard"><b>${esc(i.new_status)}</b><div class="muted small">${fmtDate(i.created_at)} ${esc(i.note||'')}</div></div>`).join('')||'<p class="muted">Sin cambios registrados.</p>'}<h3>Mensajes</h3>${(m||[]).map(i=>`<div class="rowCard"><b>${i.sender_role==='cliente'?'Cliente':'Administración'}</b><div>${esc(i.message)}</div><div class="muted small">${fmtDate(i.created_at)}</div></div>`).join('')||'<p class="muted">Sin mensajes.</p>'}`;paymentArea.classList.toggle('hidden',!approved);paymentList.innerHTML=(r||[]).map(i=>`<div class="rowCard"><b>${esc(i.original_name||'Comprobante')}</b><div class="muted small">${fmtDate(i.created_at)} · ${esc(i.status)}</div></div>`).join('')||'<p class="muted">Aún no has subido comprobantes.</p>';if(!detail.open)detail.showModal();if(quotePoll)clearInterval(quotePoll);quotePoll=setInterval(()=>{if(detail.open&&qid.value===id)openQuote(id)},5000)}
let quotePoll=null;detail.addEventListener('close',()=>{if(quotePoll){clearInterval(quotePoll);quotePoll=null}});
paymentForm.onsubmit=async e=>{e.preventDefault();let file=paymentFile.files[0],id=qid.value;if(!file)return;let safe=(file.name||'comprobante').replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${user.id}/${id}/${Date.now()}_${safe}`;let up=await sb.storage.from('fenix-payments').upload(path,file,{upsert:false});if(up.error)return alert(up.error.message);let ins=await sb.from('fenix_payment_receipts').insert({quote_request_id:id,user_id:user.id,file_path:path,original_name:file.name});if(ins.error)return alert(ins.error.message);paymentFile.value='';await openQuote(id)};
msgForm.onsubmit=async e=>{e.preventDefault();let {error}=await sb.from('fenix_quote_messages').insert({quote_request_id:qid.value,sender_id:user.id,sender_role:'cliente',message:message.value});if(!error){message.value='';openQuote(qid.value)}else alert(error.message)}
logout.onclick=async()=>{await sb.auth.signOut();location='index.html'};init();
</script></body></html>
